<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; font-family: sans-serif; color: #1f1f1f; }
    canvas { width: 100%; height: auto; cursor: crosshair; background: #111; display: block; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    button { padding: 6px 10px; }
    p { margin: 8px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="row">
    <button id="undo" type="button">Undo point</button>
    <button id="clear" type="button">Clear</button>
    <p id="hint">Click each corner of the zone.</p>
  </div>
  <script>
    const canvas = document.getElementById("scene");
    const hint = document.getElementById("hint");
    const ctx = canvas.getContext("2d");
    let points = [];
    let image = new Image();
    let currentSrc = "";

    function send(type, data) {
      window.parent.postMessage(Object.assign({
        isStreamlitMessage: true,
        type: type
      }, data), "*");
    }

    function publish() {
      send("streamlit:setComponentValue", { value: points, dataType: "json" });
    }

    function layout() {
      const maxWidth = Math.min(960, image.naturalWidth || 960);
      const scale = image.naturalWidth ? maxWidth / image.naturalWidth : 1;
      canvas.width = Math.max(1, Math.round((image.naturalWidth || 640) * scale));
      canvas.height = Math.max(1, Math.round((image.naturalHeight || 360) * scale));
      send("streamlit:setFrameHeight", { height: canvas.height + 48 });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (image.complete && image.naturalWidth) {
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      }
      if (!points.length) {
        hint.textContent = "Click each corner of the zone.";
        return;
      }
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#00c853";
      ctx.fillStyle = "#00c853";
      ctx.beginPath();
      points.forEach((point, index) => {
        const x = point.x * canvas.width;
        const y = point.y * canvas.height;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      if (points.length >= 3) {
        ctx.closePath();
        ctx.stroke();
      } else {
        ctx.stroke();
      }
      points.forEach((point) => {
        ctx.beginPath();
        ctx.arc(point.x * canvas.width, point.y * canvas.height, 5, 0, Math.PI * 2);
        ctx.fill();
      });
      hint.textContent = points.length + " point" + (points.length === 1 ? "" : "s") + " selected.";
    }

    canvas.addEventListener("click", (event) => {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const x = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      const y = Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
      points.push({ x: x, y: y });
      draw();
      publish();
    });

    document.getElementById("undo").addEventListener("click", () => {
      points.pop();
      draw();
      publish();
    });

    document.getElementById("clear").addEventListener("click", () => {
      points = [];
      draw();
      publish();
    });

    function render(args) {
      points = Array.isArray(args.points)
        ? args.points.map((point) => ({ x: Number(point.x), y: Number(point.y) }))
        : [];
      const src = "data:image/jpeg;base64," + (args.image || "");
      if (src !== currentSrc) {
        currentSrc = src;
        image = new Image();
        image.onload = () => { layout(); draw(); };
        image.src = src;
      } else {
        draw();
      }
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.type !== "streamlit:render") return;
      render(data.args || {});
    });

    send("streamlit:componentReady", { apiVersion: 1 });
    send("streamlit:setFrameHeight", { height: 420 });
  </script>
</body>
</html>
